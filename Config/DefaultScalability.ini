; ★★★ УРОВЕНЬ СВЕЧЕНИЯ (LEVEL OF GLOW оригинала, config[32], 0..4) — ЧИСЛА ВЫБРАНЫ ВЛАДЕЛЬЦЕМ 09.09.2026.
;   Вариант `v3_rec` калибровочного ряда (Reports/bloom_calibration_2026-09-09.md §3, кадры
;   Reports/bloom_2026-09-09/): интенсивность 4.0, порог 2.5. Радиус (BloomSizeScale) и блики
;   (LensFlare*) НЕ трогаются — остаются движковыми/картовыми, как решил владелец.
;
;   НЕ CVar и НЕ секция движка: имя без «@<уровень>», Scalability такую не ищет (собирает только
;   «<Группа>@<0..3|Cine>»); файл выбран потому, что здесь живут все таблицы уровней — тот же приём,
;   что у [AsdaDefaultQuality] выше. Это ДАННЫЕ для кода: пин r.* в [SystemSettings] DefaultEngine.ini
;   получил бы приоритет 0x05 и заглушил бы и пресеты, и выбор игрока (грабля E-0b) — здесь этого нет.
;
;   ЕДИНСТВЕННЫЙ ИСТОЧНИК ЧИСЕЛ (port-shared-points). Читают ДВОЕ:
;     • C++ UAsdaVideoSettingsSubsystem::SetGlowLevel — кладёт пару в служебный unbound-PP-объём
;       «PP_Glow» (приоритет 9000) поверх карт-объёма и поверх пустой пост-обработки сцены логина;
;     • Tools/asda_bloom_rollout.py — раскатывает ступень 4 в ассеты карт (волюмы PP_<карта>).
;   Нет строки для уровня → ореол этим уровнем не переопределяется вовсе (числа в коде не дублируются).
;
;   ★★★ 19.09.2026 (фаза 2 окна настроек, решение владельца №1): ПУНКТЫ — ПО ЭТАЛОНУ «НА ЧЁМ СВЕТИТСЯ», А НЕ
;   «СИЛА». Оригинальный LEVEL OF GLOW кладёт пункт в объект свечения (`effectQuad_SetTargetCountAndBuild@0xF5E700`),
;   и пункты 1/2/3 выбирают, КАКИЕ группы рисуются в буфер свечения (`sceneRenderShadowLightPass@0xF5FCC0`:
;   1 и 3 — первая группа: игрок и привязанное к нему, 2 и 3 — мобы), а 4 перехватывает кадр целиком. Прежняя лестница
;   1.0/2.0/3.0 трактовала пункт как силу ореола — эталон так не делает. Теперь у всех светящихся пунктов ОДНА
;   сила — калибровка владельца 4.0 при пороге 2.5, а различается ОБЛАСТЬ ореола:
;     0 «Нет» — интенсивность 0 (свечения нет вовсе; вдобавок r.BloomQuality=0);
;     1 «Персонаж» / 2 «Монстр» / 3 «Персонаж+монстр» — штатный блум выключен, свечение собирает пост-материал
;       M_AsdaGlowSelect по трафарету формулой ЭТАЛОНА (ниже, Unit*/BlurBuf*): 1 — первая группа, 2 — мобы, 3 — обе.
;       ★ 19.09.2026 (ревизия): первая группа эталона — ДЕВЯТЬ списков кадра, все про игрока (тело/экипировка/волосы/
;       езда/стрелы/эффекты предметов, питомец, хранитель, «душа», флаги клана, лавки игроков, гача, рыбалка, превью);
;       застройки/деревьев/камней (маска 256), рельефа (8), NPC (32), лута (16), воды и неба в ней НЕТ
;       (RE/etalon/render_core.c:6446-6478 против 1370-1397; адреса списков — у объявления SetGlowLevel).
;       Трафарет ставится ТОЛЬКО акторам групп (10 — первая, 11 — мобы), всё прочее в группу не входит.
;       На сцене логина (второй путь кадра эталона) пункты 1/3 сводят весь кадр, 2 — без свечения;
;     4 «Все» — штатный блум кадра с калибровкой владельца 4.0 / 2.5 (выбор владельца, не формула эталона).
;   Порог по-прежнему ПОСТОЯННЫЙ (закон «порог и интенсивность двигаются вместе»).
;   ★ Строки Intensity@1..3 / Threshold@1..3 блума не дают (у 1..3 блум выключен): C++ требует строку для каждого
;     пункта (нет строки — служебный объём не трогается вовсе), числа оставлены прежние.
;
;   ★★★ 19.09.2026 — РЕВЕРС «ЧТО ПОПАДАЕТ В БУФЕР» (сборка IDB, RE/etalon/render_core.c:6446-6478,
;   effects_particles.c:60652-60742). Группа рисуется в буфер свечения ЦЕЛИКОМ (очистка 0x00FFFFFF — белый,
;   альфа 0), ПОРОГА НЕТ; два прохода размытия по 4 копии со сдвигом, сведение только на пиксели группы:
;   out = min(1, 2·G·min(1, 2·ComposeFactor/255·B2)), B_k = min(1, BlurFactor/255·Σ4 копий B_{k-1}).
;   Прежние SelectGain=0.8 / SelectRadius=0.03 (ореол ярче порога 2.5) сняты: у мобов нет пикселей ярче порога,
;   пункт 2 не светился вовсе. Числа ниже — данные .data эталона (одинаковы для ALL=пункт 4 и UNIT=пункты 1..3,
;   меняет их только чат-команда «+GLOW», `effectQuadSetAnchorTag@0xF5E910`):
;   UnitOffset        — сдвиг копий в текселях буфера размытия (float @0x15B5E34 = 0.65);
;   UnitBlurFactor    — множитель каждой копии размытия, из 255 (TFACTOR, @0x15B5E38 = 90);
;   UnitComposeFactor — множитель сведения, из 255 (TFACTOR, @0x15B5E3C = 70);
;   BlurBufSize / BlurBufSizeWide / BlurBufWideFromWidth — сторона буфера размытия 256 (@0x15B5E40/44) и вдвое
;     больше при ширине экрана ≥ 1600 (`d3dTargets_CreateScreenSurfaces@0xF5D280`).
[AsdaGlow]
Intensity@0=0.0
Threshold@0=2.5
Intensity@1=4.0
Threshold@1=2.5
Intensity@2=4.0
Threshold@2=2.5
Intensity@3=4.0
Threshold@3=2.5
UnitOffset=0.65
UnitBlurFactor=90
UnitComposeFactor=70
BlurBufSize=256
BlurBufSizeWide=512
BlurBufWideFromWidth=1600
