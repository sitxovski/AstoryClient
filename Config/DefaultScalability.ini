;   Первый замер дал «160 бесплатно» (медиана −0.134 мс), но шёл одновременно с чужими сборками C++
;   и headless-прогонами в том же проекте (совпадение доказано по меткам времени в логах).
;   Перезамер на чистой машине: 3 прогона, прямой и ОБРАТНЫЙ порядок ступеней,
;   плюс НУЛЕВОЙ КОНТРОЛЬ (та же ступень дважды) — 18 парных разностей из 18 ПОЛОЖИТЕЛЬНЫ,
;   медиана +1.22 мс (в 2.4 раза выше порога +0.5 мс). Нулевой контроль −0.111 и −0.003 мс — стенд исправен.
