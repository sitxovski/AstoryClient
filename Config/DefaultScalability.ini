; ★ Сет E-4 (07.09.2026): НАШ per-level слой [AsdaShadow@N] — НЕ CVar: бюджет ТЕНЕЙ ЛОКАЛЬНЫХ СВЕТОВ (фонари/свечения владельца)
;   по уровню sg.ShadowQuality (не [AsdaQuality@N] — тот индексируется sg.EffectsQuality; игрок, снизивший в Ctrl+N только «Тени (sg)»,
;   должен получить и меньший бюджет). Читает UAsdaLightBudgetSubsystem::LevelBudget через UAsdaDevMenuSubsystem::ScalabilityLevelValue
;   при asda.Light.ShadowBudget=-1 (по умолчанию); Ctrl+N «Тени локальных светов: бюджет» показывает это число. Нет ключа → fallback
;   UAsdaRenderSettings::ShadowBudgetFallback (8). Числа = shadow_budget_by_level в Tools/asda_light_presets.json (один источник;
;   сверка: python Tools/asda_gen_render_settings_ini.py --check). Point-свет с тенью под VSM = 6 карт, spot = 1; без VSM тени point =
;   CSM-кубмап ×6 (ShadowSetup.cpp:2685) — поэтому Low 0, Medium 2. [ОЦЕНКА — уточнено E-4 на L_LightTest]
;   ★ 12.10.2026: VSM выключен на ВСЕХ уровнях 0..3 (вкл только @Cine) — кубмапы ×6 на 0..3; числа бюджетов (данные владельца) не тронуты.
;   ★ КООРДИНАТОР 12.10.2026: устарело — VSM выключен и на «Ультра» (@Cine — уровень теней владельца); VSM ни в одном пресете, только консолью.
;-----------------------------------------------------------------------------------------------------------------

; ★★★ ВОЛНА Ф6 (10.09.2026): В ТОЙ ЖЕ СЕКЦИИ — ВТОРАЯ ПОЛОСА, ТЕНИ ЭФФЕКТ-СВЕТОВ.
;   Light.FxShadowBudget    — сколько ЭФФЕКТ-светов (UAsdaFxLightComponent) держат тень одновременно. Кошелёк
;     ОТДЕЛЬНЫЙ от Light.ShadowBudget: эффектов на плотной карте сотни (castle_of_chess — 437 кандидатов) и они
;     почти всегда ближе к игроку, чем фонари; в общей очереди «ближе — важнее» искры под ногами отобрали бы
;     тень у фонарей, ради которых бюджет и заводился. Читает UAsdaLightBudgetSubsystem::LevelFxBudget при
;     asda.Light.FxShadowBudget=-1. Нет ключа → fallback UAsdaRenderSettings::FxShadowBudgetFallback.
;   Light.FxShadowResScale  — ПОТОЛОК качества (доли разрешения карты теней) для эффект-света: действует
;     min(поле эффекта, этот потолок). Не замена полю: слабая машина не обязана тянуть 0.5, но и поднимать
;     чужие 0.25 незачем. Читает UAsdaFxLightComponent::ResolveShadowResScale при asda.Fx.Shadow.Res=-1.
;   ★ ПОЧЕМУ 0.25 И ПОЧЕМУ ЭТО НЕ «ГРЯЗНО». При выключенных виртуальных тенях (решение владельца 09.09)
;     точечный свет проецируется равномерным PCF по кубической карте, радиус фильтра ЖЁСТКО задан в ТЕКСЕЛЯХ
;     (диск 3.2 текселя, ShadowProjectionCommon.ush), поэтому вчетверо меньшее разрешение = вчетверо шире
;     полутень И вчетверо крупнее ступенька: отношение «размытие/ступенька» = 3.2 не меняется НИКОГДА.
;     Дешёвая тень поэтому выглядит мягкой и раздутой, а не рваной; теряется мелкая деталь силуэта, а не гладкость.
;     Числа замера — Reports/fx_shadow/fx_shadow_report.md.

[AsdaShadow@0]
; Low: локальные света светят, теней у них нет (CSM-кубмап ×6 на каждый — не для iGPU)
Light.ShadowBudget=0
Light.FxShadowBudget=0
Light.FxShadowResScale=0.25

[AsdaShadow@1]
; Medium: два главных (Main) фонаря с тенями (CSM)
Light.ShadowBudget=2
Light.FxShadowBudget=1
Light.FxShadowResScale=0.25

[AsdaShadow@2]
; High: четыре. (★ 12.10.2026: было «(VSM 2048 страниц)» — устарело, на High с 12.10 каскады CSM, тени point = кубмапы.)
Light.ShadowBudget=4
Light.FxShadowBudget=2
Light.FxShadowResScale=0.35

[AsdaShadow@3]
; Epic: восемь. (★ 12.10.2026: было «(VSM 4096 страниц)» — устарело, на Epic каскады CSM с 09.09.)
Light.ShadowBudget=8
; ★ Ф6: ДВЕ тени эффектов, а не четыре — по замеру 10.09 на alpen (2560×1440, конфигурация владельца):
;   две теневые колонны стоят +1.39 мс кадра (11.12 → 12.51), четыре на castle_of_chess — ещё +0.5 мс
;   проходов теней. Две — тот предел, за которым цена перестаёт быть «дешёвой». Поднять: asda.Light.FxShadowBudget N
Light.FxShadowBudget=2
