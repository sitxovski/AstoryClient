; ★ ВОЛНА Ф2-ВСЕ (09.09.2026): свет по умолчанию у ВСЕХ эффектов, кандидатов на карте сотни, ограничителей стало три.
;   Light.FxBudget       — грубый счёт одновременно светящих (цена по количеству НАСЫЩАЕТСЯ — замер Ф2 §4).
;   Light.FxScreenBudget — ★ ГЛАВНЫЙ: сумма (радиус/дистанция)^2 по светящим, то есть площадь экранного следа,
;                          которой цена прохода Lights и определяется.
;   Light.FxRadiusCap    — потолок радиуса, юн: ПРЕДОХРАНИТЕЛЬ от вручную выставленного гигантского радиуса.
;
; ★★★ ВОЛНА Ф3 (10.09.2026) — ПОЧЕМУ ЧИСЛА ИЗМЕНИЛИСЬ. Владелец погасил солнце и небо и не увидел от эффектов
;   НИ ОДНОГО светлого пятна ни на полу, ни на стенах. Причина найдена замером на его собственном уровне
;   качества (sg.EffectsQuality=0 = Low): потолок радиуса 400 юн ОБРЕЗАЛ СВЕТ РАНЬШЕ, ЧЕМ ОН ДОСТАВАЛ ДО ПОЛА.
;   Источник стоит в центроиде секции эмиттера-донора, а он у столбового эффекта высоко: у идола alpen —
;   426 юн над полом. Сфера отсечения в 400 юн земли не касается вовсе, и свет, который ГОРИТ по всем
;   счётчикам, не освещает ничего. Замер (alpen, солнце и небо погашены, камера у идола, 1280x720):
;   средняя яркость области пола 0.00 при потолке 400 → 36.3 при потолке 900, сила та же 7.68 кд.
;   Радиус затухания у обратных квадратов — это НЕ «качество», а сфера отсечения; цену определяет экранный
;   след, и его ограничивает Light.FxScreenBudget УЖЕ ПОСЛЕ потолка. То есть потолок был вторым, лишним
;   ограничителем: картинку убивал, а цену не экономил. Новые потолки ≥ 1000 = максимума radius_max всех
;   семейств (map_lantern), поэтому семейства он больше не режет.
;   Экранные бюджеты подняты на Low/Medium/High: при настоящем радиусе след ОДНОГО близкого света
;   (900/522)^2 = 2.97, двух — 6.06, и прежние 4.0 на Low пускали ровно один. Цена по замеру Ф2 §5
;   ≈0.012 мс GPU на единицу следа (16.75 → +0.20 мс), значит Low 12 стоит ≈0.14 мс.
; Low: на Low выключены и Lumen, и VSM — локальный свет тут дороже всего относительно бюджета кадра.
Light.FxBudget=8
Light.FxScreenBudget=12.000
Light.FxRadiusCap=1000.0
; ★★★ ВОЛНА Ф8 (10.09.2026): Light.FxPerEffect — СКОЛЬКО ИСТОЧНИКОВ РАЗРЕШЕНО ОДНОМУ ЭФФЕКТУ.
;   Действует только в режиме «Свет: свой у каждого эмиттера» (поле 1.1 категории Effect Glow); у эффектов
;   с режимом по умолчанию («один на эффект») ключ ни на что не влияет — именно поэтому перепечка
;   ассетов не может поднять цену кадра сама собой.
;   Кошелёк ОТДЕЛЬНЫЙ от Light.FxBudget: общий бюджет отбирает по счёту «ярче и ближе», и эффект
;   с семью светящими эмиттерами у носа камеры честно выиграл бы все семь мест, погасив семь
;   ДРУГИХ эффектов сцены — игрок увидел бы не «башня точнее», а «вокруг всё погасло».
;   Читает UAsdaFxLightSubsystem::LevelPerEffect при asda.Fx.Light.PerEffect=-1 (по умолчанию).
;   Нет ключа → 1, то есть ровно поведение волн Ф2…Ф7.
Light.FxPerEffect=1

