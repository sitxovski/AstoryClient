;-----------------------------------------------------------------------------------------------------------------
; ★★★ ДАЛЬНОСТЬ ПРОРИСОВКИ (sg.ViewDistanceQuality) — 08.09.2026, drawdistance_report.md.
;   ДО этой правки группа была ПУСТОЙ, и её значения не действовали вовсе: ревизия review_perf2k.md §5 показала, что
;   `r.ViewDistanceScale` доходит (`LastSetBy: Scalability`), но у примитивов мира `MaxDrawDistance = 0`, а движок считает
;   `MaxDrawDistance × r.ViewDistanceScale` (SceneVisibility.cpp:491-494) — масштаб множил ноль (замер: 4386 draw calls
;   при sg.ViewDistanceQuality 4 против 4384 при 2). Теперь базовые дальности ставит UAsdaCullDistanceSubsystem
;   (числа — Config/DefaultGame.ini [/Script/AsdaReborn.AsdaCullSettings]), а ЭТА группа — множитель уровня к ним.
;   Движок применяет его сам и к обычным примитивам (SceneVisibility.cpp:493), и к инстансам ISM
;   (InstancedStaticMesh.cpp:1317,1376,2046) — в C++ уровень второй раз НЕ учитывается (port-shared-points: один источник).
;   BS даёт: @0 0.4 (+ r.SkeletalMeshLODBias=2), @1 0.6 (+1), @2 0.8, @3 1.0, @Cine **10.0**.
;   ★ ЕДИНСТВЕННАЯ ДЕЛЬТА — @Cine. Десятка BaseScalability безобидна, пока отсечки нет (10 × 0 = 0), но с живой отсечкой
;   она её ПОЛНОСТЬЮ ОТМЕНЯЕТ, а у владельца в GameUserSettings.ini стоит именно sg.ViewDistanceQuality=4 (Cinematic).
;   1.25 = «дальше, чем Epic, но осмысленно» (Cinematic обязан быть ≥ Epic).
;   Уровни 0..3 остаются по BS — их шаг 0.4/0.6/0.8/1.0 и есть требуемый пользовательский разброс дальности.
;-----------------------------------------------------------------------------------------------------------------

[ViewDistanceQuality@Cine]
r.ViewDistanceScale=1.25

;-----------------------------------------------------------------------------------------------------------------
; ★★★ ЛЕСТНИЦА ТЕСТА ПРОИЗВОДИТЕЛЬНОСТИ (12.10.2026, решение владельца: «пресеты теста — как мои настройки, они гораздо лучше»).
;   Читает UAsdaBenchSubsystem::LoadLadder (не CVar и не секция движка — данные для кода, как [AsdaDefaultQuality]).
;   Ступени СВЕРХУ ВНИЗ (лучшая первая). Поля ступени: Level=0..4 — уровень всех групп sg.* (0 Низкое, 1 Среднее,
;   2 Высокое, 3 Максимальное, 4 Ультра); переопределения групп Shadow= Effects= GI= View= AA= Reflection= PostProcess=
;   Texture= Foliage= Shading= Landscape= (0..4); Scale= масштаб рендера, % (10..200; > 100 — суперсэмплинг через профиль);
;   Start=1 — стартовая ступень (одна). Тест идёт со стартовой: укладывается в эталон с запасом → вверх, не укладывается → вниз.
;   ★ Верхние ступени = настройки владельца из его профиля 12.10 (GameUserSettings.ini: все группы 3, тени 4, эффекты 4,
;   масштаб 125 %) — ровно то, на чём он играет и что видит в Ctrl+N. Менять лестницу — здесь, код не трогать.
;   ★ 12.10.2026 (пересмотр пресетов): ступени НЕ менялись — проверено: Start=1 ровно у одной («Level=2»), ступени монотонны сверху вниз
;   (3/125 → 3/100 c тенями и эффектами 4 → 3 ровный → 2 → 1 → 0 → 0/87 → 0/71). Следствие пересмотра: Shadow=4 = [ShadowQuality@Cine]
;   = теперь VSM 16×4 — две верхние ступени мерят VSM, ступень «Level=3» — каскады 4×2048².
[AsdaBenchLadder]
+Step=Level=3,Shadow=4,Effects=4,Scale=125
+Step=Level=3,Shadow=4,Effects=4,Scale=100
+Step=Level=3,Scale=100
+Step=Level=2,Scale=100,Start=1
+Step=Level=1,Scale=100
+Step=Level=0,Scale=100
+Step=Level=0,Scale=87
+Step=Level=0,Scale=71

