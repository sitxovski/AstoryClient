; ★★★ ПОДБОР ВЛАДЕЛЬЦА 09.09.2026 (вторая часть) — ТОЧКА ОТСЧЁТА СТАРТОВЫХ ГРУПП КАЧЕСТВА.
;   НЕ CVar и НЕ секция движка: имя без «@<уровень>», Scalability его не ищет (Scalability.cpp собирает только
;   «<Группа>@<0..3|Cine>») — файл выбран потому, что здесь и живут все таблицы уровней. Читает
;   UAsdaVideoSettingsSubsystem::ApplyOwnerQualityBaseline (вызов только из ApplyDefaultQuality: первый запуск и
;   «сброс вкладки Качество»). Ключ = имя группы sg.*, значение = уровень 0..4, которого держится владелец.
;
;   ПОЧЕМУ НЕ ПИН sg.* В [SystemSettings] DefaultEngine.ini: там значение получило бы приоритет SystemSettingsIni (0x05)
;   и пресет/пробник железа его больше не сменили бы — ровно грабля сета E-0b («Low не был Low»). Здесь это ДАННЫЕ
;   для кода, а не CVar-пин: игрок и пробник по-прежнему сильнее.
;
;   ПРАВИЛО ПРИМЕНЕНИЯ (AsdaVideoSettingsSubsystem.cpp, ApplyOwnerQualityBaseline):
;       результат = (уровень_пробника >= 3) ? подбор_владельца : Min(уровень_пробника, подбор_владельца)
;   То есть на НОРМАЛЬНОМ железе (пробник выдал верхний свой уровень 3 = Epic) группа встаёт ровно в число владельца,
;   а на СЛАБОМ подбор работает только как ПОТОЛОК и поднять уровень не может: ноутбук, которому пробник дал 0/1,
;   получит тени 0/1, а не 4. Строки здесь нет → группа не трогается вовсе.
;
;   Числа — из GameUserSettings.ini владельца (09.09.2026 09:40, [ScalabilityGroups]).
;   ★ 12.10.2026 (решение владельца): первый запуск = пресет High (2, «Высокое») БЕЗ пробника (asda.Video.AutoDetect по
;   умолчанию 0; UAsdaVideoSettingsSubsystem::kDefaultPreset). При стартовом уровне 2 правило Min() обе строки ниже оставляет
;   на 2 — подбор вступает лишь при включённом пробнике на сильном железе (уровень 3). Строки сохранены для этого случая.
[AsdaDefaultQuality]
