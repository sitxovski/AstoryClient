;   (DerivedDataCacheStoreHierarchy.cpp:854-870) ⇒ DF/шейдеры/текстуры лежали ДВАЖДЫ — файловый %LOCALAPPDATA%/UnrealEngine/Common/DerivedDataCache
;   (8.25 ГиБ после E-1) + Zen …/Common/Zen/Data (7.85 ГиБ), review_setE1.md В-2. Оставлен ФАЙЛОВЫЙ (= движковый граф
;   InstalledNoZenLocalFallback, BaseEngine.ini:2776 — тот, на который движок сам падает, если zenserver не стартует, т.е. поддерживаемая
;   конфигурация). Почему файловый, а не Zen: (1) без процесса zenserver (память/порт 8558) и без его GC 14 дней по простою
;   (Zen.AutoLaunch --gc-cache-duration-seconds 1209600 — иначе DF всех мешей (~190 мин ядер) пересобираются после двух недель отпуска);
;   файловый чистится по UnusedFileAge=34 дня; (2) будущий общий DDC для владельца/агентов — файловый Shared (Path=NAS) без второго
