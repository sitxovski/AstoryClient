; ═══ ★ [ПОРТ] GM-режим «Скрыться»: операторские префиксы ИМЕНИ ПЕРСОНАЖА ═══════════════════════
;   [ОРИГИНАЛ] сервер прячет оператора при входе и портале, глядя ТОЛЬКО на UserIndex учётки
;   (`sub_52ECF0`, диапазон 0…5000 включительно). Имени он не читает нигде.
;   [ПОРТ] клиент дополнительно считает себя оператором, если ИМЯ ПЕРСОНАЖА начинается с одного
;   из перечисленных ниже префиксов. Сверять надо именно имя персонажа: у логинов учёток живой
;   базы (`Us_member.Us_id` = sitxovski, Rimy) префикса нет ни у одного.
;   Регистр не важен, разделитель — запятая. Пустая строка = оставить умолчание кода (GM_,ADM_).
;   То же значение правится в рантайме ключом `asda.Gm.OperatorNamePrefixes`;
;   полный откат критерия по имени — `asda.Gm.OperatorByCharName 0`.
[AsdaGm]
OperatorNamePrefixes=GM_,ADM_

; ★★★ [ПОРТ] 12.10.2026 АВТОПОДБОР ГРАФИКИ ЗАМЕРОМ КАДРА (UAsdaBenchSubsystem, решение владельца: вариант В2, окно хода, применение по «ОК»).
;   Карта и камера замера первого запуска — ТЕ ЖЕ, что во всей таблице кампании производительности 08–09.09.2026:
;   alpen (mapId 3), камера k1_a1_0208 из set0_alpen_cams.json (loc −39800 14200 3600, pitch −40, yaw 45) — числа сравнимы с замерами
;   владельца (Reports/render_sets_2026-09-05/). Герой ставится в точку камеры (как BugItGo кампании), орбит-камера под углами.
;   Эталон/времена/лестница — ключи asda.Bench.* (код); здесь только данные сцены (port-shared-points: числа не дублируются в коде).
[AsdaBench]
MapId=3
CamX=-39800
CamY=14200
CamZ=3600
CamYaw=45
CamPitch=-40

; ★ EAC Э1 (16.10.2026): клиентский Easy Anti-Cheat — UAsdaAntiCheatSettings (модуль Source/AsdaAntiCheat), CONTRACT.md §7.
;   Хост сайдкара отдельно не задаётся — это хост LoginManager (адрес сервера в OPSet/поле SERVER_IP_INPUT), порт SidecarPort.
;   Идентификаторы несекретные (CONTRACT.md §0). ClientSecret игрового клиента «Alpha» вписан координатором 16.10: он уходит
;   каждому игроку внутри pak (ini шифруются), в отчёты/журналы/MEMANTO его не копировать. Включение: Shipping — всегда, Development — только с ключом -AsdaEac, -AsdaNoNet — никогда.
