; ★ Волна В2 античита (12.10.2026): раздача — Shipping + ForDistribution (03_client.md §1.2, §7 п.1). Эти два ключа
;   читает ТОЛЬКО меню редактора «Package Project» (оно само добавляет -clientconfig=Shipping -distribution);
;   RunUAT из командной строки берёт конфигурацию из -clientconfig=…, поэтому прогоны самотестов/Development-упаковка
;   не меняются. В Shipping нет консоли `~`, cvar/команд и UE_LOG (bUseLoggingInShipping=false в AsdaReborn.Target.cs) —
;   самотесты и разбор логов гонять на Development.
BuildConfiguration=PPBC_Shipping
BuildTarget=AsdaReborn
FullRebuild=False
ForDistribution=True
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
; ВЫКЛЮЧЕНО: с True упаковка падает "Failed sending oplog request to Zen ... AutoLaunch"
; (Zen-хранилище умирает вместе с процессом UnrealPak). Памятка: no-rebuild-packaged-game. 2026-09-08
bUseZenStore=False
bMakeBinaryConfig=False
; ★ 16.10.2026: разбивка на чанки для дельта-обновлений (правила — секция [/Script/AsdaReborn.AsdaAssetManager] в конце файла)
bGenerateChunks=True
bGenerateNoChunks=False
; ★ 09.10.2026 (мультиязычность RU+EN, этап 5): культуры сборки. InternationalizationPreset=All — данные ICU всех
;   культур (иначе в упакованной игре SetCurrentCulture("ru") может не сработать); CulturesToStage — какие культуры
;   кладутся в сборку: их L10N-пакеты (/Game/L10N/<культура>/…, английские атласы) кукаются вместе с исходными.
;   Язык игры выбирает FAsdaLang (Source/AsdaReborn/Public/Text/AsdaLang.h), DefaultCulture — культура по умолчанию сборки.
