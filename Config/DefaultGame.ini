;-----------------------------------------------------------------------------------------------------------------
; ★★★ ОТСЕЧКА ДАЛЬНОСТИ ПРОРИСОВКИ ГЕОМЕТРИИ (08.09.2026, drawdistance_report.md). Единственное место, где живут ЧИСЛА
;   радиусов; читает UAsdaCullDistanceSubsystem (Source/AsdaReborn/Private/World/AsdaCullDistanceSubsystem.cpp).
;   Правило класса: Dist = Clamp(радиус габаритов × SizeFactor, MinDistance, MaxDistance), затем ПОЛ ВИДИМОСТИ
;   (bUseFogFloor), затем ползунок asda.Cull.Scale, и в конце движок сам множит на r.ViewDistanceScale уровня
;   (Config/DefaultScalability.ini [ViewDistanceQuality@N]) — второй раз уровень не учитывается.
;   Откат одним ключом: asda.Cull.Enable 0 (возвращает авторские значения ассетов = прежнее поведение порта).
;-----------------------------------------------------------------------------------------------------------------
[/Script/AsdaReborn.AsdaCullSettings]
; Террейн и вода: у карты ОДИН меш SM_terrain/SM_water на всю площадь (Tools/asda_build_map_level.py build_terrain) —
;   отсечка означала бы «земля исчезла». Никогда.
; ★★★ MaxDistance Prop/Instanced = 30 000 (было 20 000, поднято 08.09.2026 ЗАМЕРОМ на nightvalley). Прежние 20 000
;   обосновывались границей динамических теней («выше неё отсечка не даёт ничего») — это верно ДЛЯ ТЕНЕЙ, но не для
;   базового прохода: крупные объекты за 25 000 эффективных юн видны глазом. Кадры путём игрока, nightvalley, камера 3
;   «долина с NPC» (сцена заморожена, эталон = asda.Cull.Enable 0, доля пикселей с |Δ| > 8, шум повтора 0.00 %):
;       Max 20000 (25000 эфф.) → 1.84 %  |  Max 30000 (37500 эфф.) → 0.06 %  |  Max 50000 → 0.04 %
;   Пол видимости на camера 3 не работает по определению (он поднимает МИНИМУМ, а крупные объекты режет МАКСИМУМ) —
;   ревизия предполагала виновником MinDistance, замер показал MaxDistance. Скелеталы там ни при чём: 0.04 %.
;   Цена: на уровне владельца (×1.25) перестают отсекаться самые крупные объекты в 25 000..37 500 юн; на Low (×0.4)
;   отсечка крупных уходит с 8 000 на 12 000 юн, а основная масса объектов сидит на полу видимости и не меняется.
; ★ 12.10.2026 (владелец: NPC и мобы должны попадать в дальность при любом ползунке/уровне): класс Skeletal (NPC, мобы,
;   чужие игроки, питомцы — USkeletalMeshComponent) ВЫВЕДЕН из отсечки по дальности: bCull=False → UAsdaCullDistanceSubsystem::
;   DistanceFor возвращает 0 = «никогда не отсекать», MaxDrawDistance остаётся авторским 0. Причина: итог правила ещё умножался
;   на ползунок игрока asda.Cull.Scale (0.5…2) и r.ViewDistanceScale уровня (Низкое 0.4) — на Низком с ползунком 50 % мобы
;   исчезали в 1200 юн (12 м), а сервер присылает мобов в радиусе 30 тайлов (3000 юн). Скелетных ограничивает зона интереса
;   сервера (NPC на карте — десятки), ползунок остаётся для окружения (Prop/Instanced). Числа правила (60/6000/12000) оставлены
;   как было для asda.Cull.Set на лету (0 0 0 = не отсекать; любые ненулевые — включить обратно для замера).
Classes=((Terrain, (bCull=False,SizeFactor=0.000000,MinDistance=0.000000,MaxDistance=0.000000,bUseFogFloor=False)),(Sky, (bCull=False,SizeFactor=0.000000,MinDistance=0.000000,MaxDistance=0.000000,bUseFogFloor=False)),(Prop, (bCull=True,SizeFactor=45.000000,MinDistance=6000.000000,MaxDistance=30000.000000,bUseFogFloor=True)),(Instanced, (bCull=True,SizeFactor=45.000000,MinDistance=6000.000000,MaxDistance=30000.000000,bUseFogFloor=True)),(Skeletal, (bCull=False,SizeFactor=60.000000,MinDistance=6000.000000,MaxDistance=12000.000000,bUseFogFloor=False)),(Effect, (bCull=False,SizeFactor=60.000000,MinDistance=5000.000000,MaxDistance=10000.000000,bUseFogFloor=False)))
; ★★★ ПОЛ ВИДИМОСТИ, юн — главное число подсистемы: ниже него дальность классов с bUseFogFloor=True не опускается
;   ни на одной карте. Итог пола = Clamp(max(VisibilityFloorMin, начало тумана × FogSafetyFactor), 0, FogFloorMax).
;   ★ 15 000 ВЫБРАНО ПИКСЕЛЬНЫМ ЗАМЕРОМ, А НЕ ФИЗИКОЙ ТУМАНА (исправление ревизии review_drawdistance.md §1: прежнее
;   обоснование «за туманом объект и так не виден» НЕВЕРНО — на взятых 18 750 юн непрозрачность тумана alpen 62 % при
;   авторской плотности, а с настройкой владельца asda.Fog.DensityScale=0.39 и вовсе 31 % (живой дамп 08.09.2026:
;   начало тумана 10 000 юн, плотность 0.0889, 85 % туман набирает лишь на 54 432 юн). Кадры путём игрока, alpen,
;   5 камер, сцена заморожена, доля пикселей с |Δ| > 8 против
;   «отсечка выключена» (эффективный радиус = это число × r.ViewDistanceScale уровня, у владельца ×1.25):
;       шум повтора 1.26 % | 31250 юн -> 2.38 % | 18750 юн -> 4.80 % | 15000 юн -> 5.79 % | 7500 юн -> 14.60 %
;   15 000 × 1.25 = 18 750 эффективных — рабочая точка: на 4 камерах из 5 неотличимо от шума, на пятой 4.8 % против 1.3 %.
;   ★ ЗАЧЕМ ПОЛ ОТДЕЛЬНО ОТ ТУМАНА (ревизия §2): пол только от начала тумана не защищал 4 карты с близким, но ТОНКИМ
;   туманом — nightvalley (пол был 150 юн), Mountain Flamion (2100), inferion (3000), quizstage (3000): там правил
;   MinDistance 6000 -> 7500 эффективных, и именно на nightvalley замер поймал 2.02 % изменённых пикселей при шуме 0.01 %.
VisibilityFloorMin=15000.000000
; Привязка к началу тумана: StartDistance тумана карты (уже с asda.Fog.DistanceScale владельца) × этот множитель.
;   Только ПОДНИМАЕТ пол выше VisibilityFloorMin — на картах с дальним туманом (flammio 10 000, sunnycoast 11 500,
;   battlefield/silalis/conquester 8 000) 15 000 юн мало, там туман ещё не начался, и пол уходит в потолок 20 000.
;   Опустить пол ниже VisibilityFloorMin она не может: берётся максимум. 0 = привязку не применять.
FogSafetyFactor=1.500000
; Потолок пола — карта с очень дальним туманом не должна снимать отсечку совсем. 20 000 юн выбрано по границе теней:
;   дальность динамических теней карты = 20 000 юн (DynamicShadowDistance), а 73 % draw calls кадра — проход теней,
;   и теневые кастеры отсекаются по дальности ПРИМИТИВА (ShadowSetup.cpp:2293). Радиус выше 20 000 не даёт ничего.
FogFloorMax=20000.000000
; ДИАГНОСТИКА (в расчёт дальностей не входит): какую непрозрачность asda.Cull.Dump считает «объект скрыт туманом».
;   Дамп печатает непрозрачность на полу видимости и дистанцию, где туман карты её набирает — чтобы обоснование
;   «туман прикрывает» больше не принималось на веру. Формула: 1 − e^(−(ln2)²·density/1000·(L−Start)) (review_setA_fix.md §2).
FogDiagOpacity=0.850000
; Не чаще этого (секунды) выполняется полный проход мира при смене ключей/ползунка. Ревизия §6: перетаскивание ползунка
;   «Дальность прорисовки» давало полный обход мира КАЖДЫЙ кадр. Последнее значение ползунка применяется всегда.
;   0 = каждый тик (поведение до доводки 08.09.2026).
ApplyThrottleSec=0.200000
; Миры без отсечки: сцена логина (авторская постановка с полётом камеры, тумана нет, проблемы с кадром нет)
;   и экран загрузки. Проверено 08.09.2026: без этого в мире Login 699 статичных мешей получали 7500..25000 юн.
+SkipWorlds=Login
+SkipWorlds=L_Loading
bApplyInPIE=True
; ★ КАНАРЕЙКА КОНФИГА (ревизия §3: «числа ini совпали с дефолтами C++ до последней цифры» — опечатка уходила в страховку
;   молча). Дефолт C++ = 0, здесь дата последней правки секции. Если UAsdaCullSettings::ValidateConfig видит 0 — секция
;   не прочиталась вовсе, и в лог идёт Error. Отдельные пропавшие ключи он же перечисляет поимённо.
ConfigStamp=20261012

